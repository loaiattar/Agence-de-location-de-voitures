services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caragence-app
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/data/caragence.db"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: caragence-nginx
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      com.datadoghq.ad.logs: '[{"source": "nginx", "service": "caragence-nginx"}]'
    restart: unless-stopped

volumes:
  sqlite-data:
