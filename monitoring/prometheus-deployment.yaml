apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: caragence
  labels:
    app: caragence
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caragence
      component: monitoring
  template:
    metadata:
      labels:
        app: caragence
        component: monitoring
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
