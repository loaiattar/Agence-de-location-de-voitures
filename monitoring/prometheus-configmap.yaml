apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: caragence
  labels:
    app: caragence
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/alert_rules.yml"

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - "localhost:9090"

      - job_name: caragence-app
        scrape_interval: 10s
        static_configs:
          - targets:
              - "caragence-app.caragence.svc.cluster.local:8080"
        metrics_path: /health

      - job_name: nginx
        static_configs:
          - targets:
              - "caragence-nginx.caragence.svc.cluster.local:9113"
        metrics_path: /metrics

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: true
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels:
              - __meta_kubernetes_namespace
            action: replace
            target_label: kubernetes_namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            action: replace
            target_label: kubernetes_pod_name

  alert_rules.yml: |
    groups:
      - name: caragence
        rules:
          - alert: PodNotReady
            expr: kube_deployment_status_replicas_ready{namespace="caragence"} < 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod not ready in caragence"
              description: "Deployment {{ $labels.deployment }} has {{ $value }} ready replicas"

          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{namespace="caragence"} / 1024 / 1024 > 200
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage in caragence"
              description: "Container {{ $labels.name }} using {{ $value | humanize }}MB"

          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace="caragence"}[15m]) > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod crash looping in caragence"
              description: "Pod {{ $labels.pod }} restarted {{ $value }} times"

          - alert: PVCNearFull
            expr: kubelet_volume_stats_used_bytes{namespace="caragence"} / kubelet_volume_stats_capacity_bytes{namespace="caragence"} > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PVC storage nearly full"
              description: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
