apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: caragence
  labels:
    app: caragence
    component: grafana
    grafana_dashboard: "1"
  annotations:
    grafana-dashboard-folder: "CarAgence"
data:
  caragence-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "App Pods Ready",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"caragence\", deployment=\"caragence-app\"}",
              "legendFormat": "Ready Pods",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Nginx Pods Ready",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"caragence\", deployment=\"caragence-nginx\"}",
              "legendFormat": "Ready Pods",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "CPU Usage",
          "type": "gauge",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"caragence\"}[5m])) * 100",
              "legendFormat": "CPU %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Memory Usage",
          "type": "gauge",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{namespace=\"caragence\"}) / 1024 / 1024",
              "legendFormat": "Memory MB",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "decmbytes",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 200 },
                  { "color": "red", "value": 400 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "HTTP Requests",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "rate(nginx_http_requests_total{namespace=\"caragence\"}[5m])",
              "legendFormat": "{{method}} {{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto"
              },
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "title": "Pod Restarts",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total{namespace=\"caragence\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto"
              },
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "title": "Network Traffic",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            {
              "expr": "rate(container_network_receive_bytes_total{namespace=\"caragence\"}[5m])",
              "legendFormat": "{{pod}} receive",
              "refId": "A"
            },
            {
              "expr": "rate(container_network_transmit_bytes_total{namespace=\"caragence\"}[5m])",
              "legendFormat": "{{pod}} transmit",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto"
              },
              "unit": "Bps"
            },
            "overrides": []
          }
        },
        {
          "title": "SQLite Storage",
          "type": "gauge",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [
            {
              "expr": "node_filesystem_size_bytes{mountpoint=\"/data\", namespace=\"caragence\"} / 1024 / 1024",
              "legendFormat": "Total MB",
              "refId": "A"
            },
            {
              "expr": "node_filesystem_avail_bytes{mountpoint=\"/data\", namespace=\"caragence\"} / 1024 / 1024",
              "legendFormat": "Available MB",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "decmbytes",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 800 }
                ]
              }
            },
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["caragence"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "CarAgence Dashboard",
      "uid": "caragence-dashboard",
      "version": 1
    }
