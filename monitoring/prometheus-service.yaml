apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: caragence
  labels:
    app: caragence
    component: monitoring
spec:
  selector:
    app: caragence
    component: monitoring
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
  type: NodePort
